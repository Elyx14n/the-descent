AllCops:
  NewCops: enable
  Include:
    - "Gemfile"
    - "Rakefile"
    - "lib/**/*.rb"
    - "mygame/app/**/*.rb"
    - "mygame/tests/**/*.rb"
  Exclude:
    - "vendor/**/*"
    - "docs/**/*"
    - "samples/**/*"
    - ".dragonruby/**/*"
    - "tmp/**/*"
    - "logs/**/*"
    - "build/**/*"
    - "builds/**/*"
    - "mygame/app/repl.rb"

Layout/LineLength:
  Max: 120

Metrics/MethodLength:
  Enabled: false

Metrics/ModuleLength:
  Enabled: false

Metrics/BlockLength:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/CollectionLiteralLength:
  Enabled: false

Style/Documentation:
  Enabled: false

Naming/MethodParameterName:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

Metrics/ParameterLists:
  Enabled: false

Style/SuperArguments:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Style/MultilineTernaryOperator:
  Enabled: false
