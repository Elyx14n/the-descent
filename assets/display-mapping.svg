<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 210" role="img">
<style>text { font: 15px system-ui,sans-serif; fill: #222b2b; } .grid { stroke: #b6c0b1; } .edge { stroke: #59635e; stroke-width: 2; } .guide { stroke: #885221; stroke-width: 2; } .arrow { stroke: #12665c; stroke-width: 2; marker-end: url(#tip); }</style>
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#12665c"/></marker></defs>
<rect width="800" height="210" fill="#eef0e9"/>
<title>Display margin and enlarged image</title><desc>The output position includes both the margin before the image and the enlarged position within the image.</desc>
<rect x="40" y="25" width="700" height="110" fill="#d4d8d0" stroke="#59635e"/>
<rect x="180" y="25" width="560" height="110" fill="#e1ebe2" stroke="#12665c"/>
<text x="105" y="80" text-anchor="middle">margin</text><text x="200" y="48">enlarged game image</text>
<line class="edge" x1="470" x2="470" y1="65" y2="125"/><text x="482" y="95">actor edge</text>
<line class="arrow" x1="180" x2="470" y1="152" y2="152"/><text x="320" y="173" text-anchor="middle">position within the image</text>
<line class="arrow" x1="40" x2="470" y1="190" y2="190"/><text x="565" y="195">display position</text>
</svg>
