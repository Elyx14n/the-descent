<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 210" role="img">
<style>text { font: 15px system-ui,sans-serif; fill: #222b2b; } .grid { stroke: #b6c0b1; } .edge { stroke: #59635e; stroke-width: 2; } .guide { stroke: #885221; stroke-width: 2; } .arrow { stroke: #12665c; stroke-width: 2; marker-end: url(#tip); }</style>
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#12665c"/></marker></defs>
<rect width="800" height="210" fill="#eef0e9"/>
<title>Area scales along both directions</title><desc>A small image grows into a larger grid with a width expansion and a height expansion, each labeled k.</desc>
<rect x="55" y="80" width="100" height="60" fill="#d6aa77" stroke="#885221"/>
<line class="arrow" x1="185" x2="300" y1="110" y2="110"/><text x="242" y="88" text-anchor="middle">scale</text>
<rect x="350" y="40" width="330" height="130" fill="#e1ebe2" stroke="#12665c"/>
<line class="grid" x1="405" x2="405" y1="40" y2="170"/><line class="grid" x1="460" x2="460" y1="40" y2="170"/><line class="grid" x1="515" x2="515" y1="40" y2="170"/><line class="grid" x1="570" x2="570" y1="40" y2="170"/><line class="grid" x1="625" x2="625" y1="40" y2="170"/><line class="grid" x1="350" x2="680" y1="72" y2="72"/><line class="grid" x1="350" x2="680" y1="104" y2="104"/><line class="grid" x1="350" x2="680" y1="136" y2="136"/>
<line class="arrow" x1="350" x2="680" y1="20" y2="20"/><text x="515" y="193" text-anchor="middle">width × k</text>
<line class="arrow" x1="710" x2="710" y1="40" y2="170"/><text x="730" y="97">height</text><text x="730" y="120">× k</text>
</svg>
