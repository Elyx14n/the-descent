name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  scan_ruby:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      
      - name: Scan for vulnerable gems
        run: bin/bundler-audit

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '.rubocop.yml', 'Gemfile.lock') }}
        with:
          path: ${{ runner.temp }}/rubocop
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}
          restore-keys: |
            rubocop-${{ runner.os }}-


      - name: Lint code
        env:
          RUBOCOP_CACHE_ROOT: ${{ runner.temp }}/rubocop
        run: bin/rubocop --parallel -f github

  test:
    # Fork PRs and Dependabot cannot access the SDK download secret.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      # DragonRuby 7.21 Standard; update deliberately with the team's SDK.
      DRAGONRUBY_BUILD: 1067b5956cd044e4a736e07309e4d95b4f5090b3a
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
        
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install headless graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgl1-mesa-dri
      - name: Download DragonRuby
        env:
          ITCH_API_KEY: ${{ secrets.ITCH_API_KEY }}
        run: |
          if [[ -z "$ITCH_API_KEY" ]]; then
            echo '::error::Add the ITCH_API_KEY repository secret using an account API key with DragonRuby download access.'
            exit 1
          fi
          upload_id=$(curl --fail --silent --show-error --retry 3 \
            -H "Authorization: Bearer $ITCH_API_KEY" \
            https://api.itch.io/games/404609/uploads | ruby -rjson -e '
              response = JSON.parse($stdin.read)
              abort "itch.io rejected the upload-list request; verify the CI account key." if response.key?("errors")
              uploads = response["uploads"]
              abort "itch.io did not return an uploads array." unless uploads.is_a?(Array)
              matches = uploads.select { |upload| (upload["channel_name"] || upload["channelName"]) == "linux-amd64-jam" }
              unless matches.length == 1
                fields = %w[id filename display_name displayName channel_name channelName demo]
                warn JSON.pretty_generate(uploads.map { |upload| upload.select { |key, _| fields.include?(key) } })
                abort "Expected one linux-amd64 SDK upload; found #{matches.length}. Available files are listed above."
              end
              id = matches.first.fetch("id")
              abort "Invalid SDK upload ID." unless id.is_a?(Integer) && id.positive?
              puts id
            ')
          curl --location --fail --silent --show-error --retry 3 \
            --proto '=https' --proto-redir '=https' \
            -H "Authorization: Bearer $ITCH_API_KEY" \
            "https://api.itch.io/uploads/$upload_id/download" -o "$RUNNER_TEMP/dragonruby.zip"
          unzip -q "$RUNNER_TEMP/dragonruby.zip" -d "$RUNNER_TEMP/dragonruby"
          echo "DRAGONRUBY_HOME=$RUNNER_TEMP/dragonruby/dragonruby-linux-amd64" >> "$GITHUB_ENV"

      - name: Check DragonRuby build
        run: |
          actual_build=$(awk '$1 == "git:" { print $2 }' "$DRAGONRUBY_HOME/VERSION.txt")
          if [[ "$actual_build" != "$DRAGONRUBY_BUILD" ]]; then
            echo "::error::DragonRuby build $actual_build differs from expected $DRAGONRUBY_BUILD. Review the SDK upgrade and update CI with the team's build."
            exit 1
          fi
          chmod +x "$DRAGONRUBY_HOME/dragonruby"

      - name: Run native suite
        run: bin/rake test
