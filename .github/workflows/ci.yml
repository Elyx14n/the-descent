name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  scan_ruby:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      
      - name: Scan for vulnerable gems
        run: bin/bundler-audit

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '.rubocop.yml', 'Gemfile.lock') }}
        with:
          path: ${{ runner.temp }}/rubocop
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}
          restore-keys: |
            rubocop-${{ runner.os }}-


      - name: Lint code
        env:
          RUBOCOP_CACHE_ROOT: ${{ runner.temp }}/rubocop
        run: bin/rubocop --parallel -f github

  test:
    # Fork PRs and Dependabot cannot access the SDK download secret.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      DRAGONRUBY_BUILD: 0c37cf3bb50cff40b47bc6b935bdd106e47aebada
    steps:
      - name: Validate API key
        run: test -n "${{ secrets.DRAGONRUBY_GTK }}" || (echo "::error::Missing DRAGONRUBY_GTK secret." && exit 1)

      - name: Checkout Game code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout Dragonruby GTK repo
        uses: actions/checkout@v7
        with:
          repository: 'Elyx14n/dragonruby-gtk'
          token: ${{ secrets.DRAGONRUBY_GTK }}
          path: dragonruby-tmp
          persist-credentials: false
      
      - name: Set DragonRuby Home
        run: |
          unzip -q "$GITHUB_WORKSPACE/dragonruby-tmp/dragonruby-gtk-linux-amd64.zip" -d "$RUNNER_TEMP/dragonruby"
          echo "DRAGONRUBY_HOME=$RUNNER_TEMP/dragonruby/dragonruby-linux-amd64" >> "$GITHUB_ENV"       

      - name: Check DragonRuby build
        run: |
          actual_build=$(awk '$1 == "git:" { print $2 }' "$DRAGONRUBY_HOME/VERSION.txt")
          if [[ "$actual_build" != "$DRAGONRUBY_BUILD" ]]; then
            echo "::error::DragonRuby build $actual_build differs from expected $DRAGONRUBY_BUILD. Review the SDK upgrade and update CI with the team's build."
            exit 1
          fi
          chmod +x "$DRAGONRUBY_HOME/dragonruby"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install headless graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgl1-mesa-dri

      - name: Run native suite
        run: bin/rake test
